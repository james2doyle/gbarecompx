// gbarecomp-app.gradle — shared Android application configuration.
//
// A game's app/build.gradle applies `com.android.application`, declares an
// `ext.gbaGame = [...]` map, then `apply from:` this file. Everything else —
// the shared Java shell (org.gbarecomp.*), the manifest, the native CMake
// root (raylib/NativeActivity since Phase 4f), payload staging and ABI
// policy — lives here so every gbarecomp Android game builds the same way.
//
// Required gbaGame keys:
//   applicationId, versionCode, versionName, title, romSha1 (list or CSV),
//   romSize, romFile, variant (variants/<variant>/game.toml target path),
//   gameToml (File: Android runtime TOML), gameRoot (File), engineRoot (File)
// Optional:
//   romLabel, biosRequired (false), orientation ("landscape"|"portrait"|"any"),
//   payloadVersion ("1"), setupNote, gyro (false), payloadDirs ([[from:File, into:String]]),
//   cmakeArguments ([]), recompUiRoot (File), releaseAbis (["arm64-v8a"]),
//   debugAbis (["arm64-v8a","x86_64"]),
//   saveFile ("", e.g. "game.sav"), saveSize (0 = any non-empty size accepted;
//     games with a fixed battery size pin it, e.g. 65536 for 512-Kbit flash).
//   When saveFile is empty the setup screen shows no save card; when set it
//   shows an optional "Save data" import (never blocks PLAY).
//   launchBoxartRes (File): the game's launch-screen box art, staged as
//     drawable-nodpi/launcher_boxart.png for the setup screen (resolved by
//     name via getIdentifier; the engine's Java stays namespace-agnostic).
//
// Private personal builds may embed verified assets (never distribute them):
//   -PprivateRom=<path> [-PprivateBios=<path>]

def g = project.ext.gbaGame
def required = ["applicationId", "versionCode", "versionName", "title", "romSha1",
                "romSize", "romFile", "variant", "gameToml", "gameRoot", "engineRoot"]
required.each { key ->
    if (!g.containsKey(key) || g[key] == null)
        throw new GradleException("gbaGame.${key} is required by gbarecomp-app.gradle")
}

def engineRoot = file(g.engineRoot)
def gameRoot = file(g.gameRoot)
def platformRoot = new File(engineRoot, "platform/android")

def cmakePath = { File f -> f.absolutePath.replace('\\', '/') }
def romShas = (g.romSha1 instanceof Collection ? g.romSha1 : g.romSha1.toString().split(","))
    .collect { it.toString().trim().toLowerCase() }
def orientation = (g.orientation ?: "landscape").toString()
def activityOrientation = orientation == "any" ? "fullUser"
    : orientation == "portrait" ? "sensorPortrait" : "sensorLandscape"
def stagedPayload = layout.buildDirectory.dir("generated/gbarecompPayload")
def privateBiosPath = providers.gradleProperty("privateBios").orNull
def privateRomPath = providers.gradleProperty("privateRom").orNull
def debugAbis = g.debugAbis ?: ["arm64-v8a", "x86_64"]
def releaseAbis = g.releaseAbis ?: ["arm64-v8a"]
// -PgbaAbis=x86_64 (comma list) narrows a build, e.g. emulator-only iteration;
// the generated corpus is large, so each extra ABI is a full native build.
// Release signing: a stable release key keeps sideload updates installing over
// earlier versions on every machine. Sources, highest first:
//   -PgbaKeystore=<file.jks> -PgbaKeystorePassword= -PgbaKeyAlias= [-PgbaKeyPassword=]
//   GBARECOMP_KEYSTORE / _KEYSTORE_PASSWORD / GBARECOMP_KEY_ALIAS / _KEY_PASSWORD
//   <game>/android/signing.local.properties (gitignored): storeFile / storePassword /
//     keyAlias / keyPassword, or signingProperties=<central file with those keys>
// Without any, release builds fall back to the local debug key (loud warning).
def signingLocal = new Properties()
def signingLocalFile = new File(rootDir, "signing.local.properties")
if (signingLocalFile.isFile()) {
    signingLocalFile.withInputStream { signingLocal.load(it) }
    def central = signingLocal.getProperty("signingProperties")
    if (central) {
        def centralFile = new File(central)
        if (!centralFile.isFile())
            throw new GradleException("signing.local.properties points at a missing file: ${central}")
        signingLocal = new Properties()
        centralFile.withInputStream { signingLocal.load(it) }
    }
}
def prop = { String p, String env -> providers.gradleProperty(p).orNull ?: System.getenv(env) }
def releaseKeystore = prop("gbaKeystore", "GBARECOMP_KEYSTORE") ?: signingLocal.getProperty("storeFile")
def releaseStorePassword = prop("gbaKeystorePassword", "GBARECOMP_KEYSTORE_PASSWORD") ?:
    signingLocal.getProperty("storePassword")
def releaseKeyAlias = prop("gbaKeyAlias", "GBARECOMP_KEY_ALIAS") ?: signingLocal.getProperty("keyAlias")
def releaseKeyPassword = prop("gbaKeyPassword", "GBARECOMP_KEY_PASSWORD") ?:
    signingLocal.getProperty("keyPassword") ?: releaseStorePassword
if (releaseKeystore && !new File(releaseKeystore).isFile())
    throw new GradleException("Release keystore not found: ${releaseKeystore}")
if (releaseKeystore && !(releaseStorePassword && releaseKeyAlias))
    throw new GradleException("Release keystore given without gbaKeystorePassword/gbaKeyAlias")
def abiOverride = providers.gradleProperty("gbaAbis").orNull
if (abiOverride) {
    debugAbis = abiOverride.split(",").collect { it.trim() }.findAll { it }
    releaseAbis = debugAbis
}

android {
    namespace g.namespace ?: g.applicationId
    compileSdk 35
    // The raylib path's proven NDK (matches the vendored native_app_glue
    // provenance; the spike ran 28.2 on device).
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId g.applicationId
        minSdk 28
        targetSdk 35
        // Release scripts stamp the version (-PgbaVersionName / -PgbaVersionCode).
        versionCode(((prop("gbaVersionCode", "GBARECOMP_VERSION_CODE") ?: g.versionCode) as String) as int)
        versionName prop("gbaVersionName", "GBARECOMP_VERSION_NAME") ?: g.versionName

        manifestPlaceholders = [
            gbaTitle: g.title,
            gbaRomLabel: g.romLabel ?: "${g.title} ROM",
            gbaRomSha1: romShas.join(","),
            gbaRomSize: "${g.romSize}",
            gbaRomFile: g.romFile,
            gbaBiosRequired: "${g.biosRequired ?: false}",
            gbaBiosSha1: g.biosSha1 ?: "0c0d404d16c6b55b3071aba714f82077da132f14",
            gbaSaveFile: g.saveFile ?: "",
            gbaSaveSize: "${g.saveSize ?: 0}",
            gbaOrientation: orientation,
            gbaActivityOrientation: activityOrientation,
            gbaPayloadVersion: "${g.payloadVersion ?: '1'}",
            gbaSetupNote: g.setupNote ?: "",
            gbaGyro: "${g.gyro ?: false}",
        ]

        externalNativeBuild {
            cmake {
                // Generated guest shards are huge; bound concurrent compiles so
                // a build cannot exhaust host memory (-PgbaNativeJobs=N).
                def jobs = (providers.gradleProperty("gbaNativeJobs").orNull ?:
                            "${g.nativeJobs ?: 8}").toString()
                def args = [
                    "-DANDROID_STL=c++_shared",
                    "-DGBA_GAME_ROOT=${cmakePath(gameRoot)}",
                    "-DGBARECOMP_ROOT=${cmakePath(engineRoot)}",
                    // The NativeActivity storage path (mobile_platform.h):
                    // /data/user/0/<applicationId>/files is the chdir target
                    // and the game's baked external dir. The pre-4f shell
                    // never needed it (its own accessor provided the path).
                    "-DGBARECOMP_ANDROID_PACKAGE=${g.applicationId}",
                    "-DCMAKE_BUILD_TYPE=Release",
                    "-DCMAKE_JOB_POOLS=gba_compile=${jobs}",
                    "-DCMAKE_JOB_POOL_COMPILE=gba_compile",
                ]
                if (g.recompUiRoot) {
                    args += "-DRECOMP_UI_ROOT=${cmakePath(file(g.recompUiRoot))}"
                    args += "-DGBARECOMP_RUNTIME_UI_ROOT=${cmakePath(file(g.recompUiRoot))}"
                }
                if (privateRomPath != null) {
                    // Private build: the ROM is embedded in the payload, and
                    // the game CMake reads GBAGAME_BUNDLED_ROM to skip the
                    // pre-boot setup path. Public builds keep the SAF import
                    // flow (the flag stays off). The pre-4f shell never needed
                    // this mapping: its launcher was compiled in, which
                    // bypassed the game's bundled-ROM check.
                    args += "-DGBAGAME_BUNDLED_ROM=ON"
                }
                args += (g.cmakeArguments ?: [])
                arguments(*args)
                cppFlags "-O2"
                targets "main"
            }
        }
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            // Same key as release when one is configured, so a device can move
            // between private/debug builds and published releases without an
            // uninstall (which would delete its saves).
            if (releaseKeystore) signingConfig signingConfigs.release
            // x86_64 lets the stock emulator images run the game natively.
            ndk { abiFilters(*debugAbis) }
        }
        release {
            minifyEnabled false
            ndk { abiFilters(*releaseAbis) }
            // Release key when configured (see above); otherwise the local
            // debug key so the APK still installs for sideload testing.
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path new File(platformRoot, "cpp/CMakeLists.txt")
            // raylib 6 requires CMake >= 3.25 (the pre-4f shell built under
            // 3.22.1); pin the SDK's newer toolchain.
            version "3.30.3"
        }
    }

    sourceSets {
        main {
            manifest.srcFile new File(platformRoot, "AndroidManifest.xml")
            java.srcDirs = [new File(platformRoot, "java")]
            res.srcDirs = [new File(platformRoot, "res"), file("src/main/res")]
            assets.srcDirs = [stagedPayload]
            if (g.launchBoxartRes != null)
                res.srcDirs += layout.buildDirectory.dir("generated/gbarecompBoxartRes")
        }
        debug {
            manifest.srcFile new File(platformRoot, "debug/AndroidManifest.xml")
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

// Launch-screen box art (optional gbaGame key launchBoxartRes, a File):
// staged as drawable-nodpi/launcher_boxart.png for the setup screen's
// launch-screen recreation. A drawable, not an APK asset — the release
// guard's assets contract is payload-only — and resolved by name via
// getIdentifier so the engine's Java stays namespace-agnostic.
if (g.launchBoxartRes != null) {
    def boxartFile = file(g.launchBoxartRes)
    tasks.register("stageGbarecompBoxartRes", Copy) {
        from(boxartFile) { rename { "launcher_boxart.png" } }
        into(layout.buildDirectory.dir("generated/gbarecompBoxartRes/drawable-nodpi"))
    }
    preBuild.dependsOn("stageGbarecompBoxartRes")
}

// Sync (not Copy) guarantees a distributable build never inherits private
// assets from an earlier private build.
tasks.register("stageGbarecompPayload", Sync) {
    inputs.property("privateRom", privateRomPath ?: "")
    inputs.property("privateBios", privateBiosPath ?: "")
    from(file(g.gameToml)) {
        into("payload/variants/${g.variant}")
        rename { "game.toml" }
    }
    (g.payloadDirs ?: []).each { entry ->
        from(file(entry.from)) { into("payload/${entry.into}") }
    }
    if (privateRomPath != null) {
        def romFile = file(privateRomPath)
        from(romFile) {
            into("payload/roms")
            rename { g.romFile }
        }
        doFirst {
            if (!romFile.isFile() || romFile.length() != (g.romSize as long))
                throw new GradleException("Private ROM must be the ${g.romSize}-byte dump")
            def sha = java.security.MessageDigest.getInstance("SHA-1")
                .digest(romFile.bytes).encodeHex().toString()
            if (!romShas.contains(sha))
                throw new GradleException("Private ROM SHA-1 ${sha} is not accepted")
        }
    }
    if (privateBiosPath != null) {
        def biosFile = file(privateBiosPath)
        from(biosFile) {
            into("payload/bios")
            rename { "gba_bios.bin" }
        }
        doFirst {
            if (!biosFile.isFile() || biosFile.length() != 16384)
                throw new GradleException("Private BIOS must be the 16 KiB gba_bios.bin dump")
            def want = (g.biosSha1 ?: "0c0d404d16c6b55b3071aba714f82077da132f14").toString().toLowerCase()
            def sha = java.security.MessageDigest.getInstance("SHA-1")
                .digest(biosFile.bytes).encodeHex().toString()
            if (sha != want)
                throw new GradleException("Private BIOS SHA-1 ${sha} is not the expected ${want}")
        }
    }
    into(stagedPayload)
}

tasks.named("preBuild").configure { dependsOn("stageGbarecompPayload") }

// Public-artifact guard: a build without private properties must not carry a
// ROM or BIOS, whatever else changed. Runs on every assemble.
tasks.register("verifyNoPrivateAssets") {
    dependsOn("stageGbarecompPayload")
    doLast {
        // A 16 KiB .bin whose SHA-1 equals the game-declared biosSha1 pin
        // (which must differ from the retail default) is declared
        // clean-room BIOS material (e.g. emibios, LGPL-3.0-or-later —
        // ffta-recomp issue #17), staged on purpose for every build
        // including public ones. Retail never gets this exemption: the
        // retail dump is never bundleable, and the retail *filename*
        // (gba_bios.bin) is not exemptable at all.
        def bundledSha = (g.biosSha1 ?: "").toString().toLowerCase()
        def retailSha = "300c20df6731a33952ded8c436f7f186d25d3492"
        def exemptBundledBios = !bundledSha.isEmpty() && bundledSha != retailSha
        if (privateRomPath == null && privateBiosPath == null) {
            def root = stagedPayload.get().asFile
            def offenders = []
            root.eachFileRecurse { f ->
                def n = f.name.toLowerCase()
                if (f.isFile() && (n.endsWith(".gba") || n.endsWith(".agb") ||
                        n == "gba_bios.bin" || f.length() == 16384L && n.endsWith(".bin"))) {
                    if (exemptBundledBios && n.endsWith(".bin") &&
                            f.length() == 16384L && n != "gba_bios.bin") {
                        def sha = java.security.MessageDigest.getInstance("SHA-1")
                                .digest(f.bytes).encodeHex().toString().toLowerCase()
                        if (sha == bundledSha)
                            return  // declared clean-room BIOS — not a private dump
                    }
                    offenders << f
                }
            }
            if (!offenders.isEmpty())
                throw new GradleException("Public build payload contains private assets: ${offenders}")
        }
    }
}
tasks.named("preBuild").configure { dependsOn("verifyNoPrivateAssets") }

// An APK carrying a ROM/BIOS is never named like a distributable one: it is
// written as <variant>-<version>-<buildType>-PRIVATE-rom-included.apk (public
// builds keep AGP's app-<buildType>.apk), so it cannot be attached to a
// release by mistake.
if (privateRomPath != null || privateBiosPath != null) {
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName =
                "${g.variant}-${variant.versionName}-${variant.buildType.name}-PRIVATE-rom-included.apk"
        }
    }
}

// Make an unsigned-by-release-key build impossible to miss.
gradle.taskGraph.whenReady { graph ->
    if (!releaseKeystore && graph.allTasks.any { it.name.startsWith("assembleRelease") })
        logger.warn("WARNING: release APK signed with the DEBUG key (no gbaKeystore configured)")
}