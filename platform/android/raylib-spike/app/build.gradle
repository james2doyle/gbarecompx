plugins {
    id "com.android.application"
}

android {
    namespace "org.gbarecomp.raylibtest"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "org.gbarecomp.raylibtest"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-O2"
                targets "raylibtest"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            ndk { abiFilters "arm64-v8a" }
        }
        release {
            minifyEnabled false
            ndk { abiFilters "arm64-v8a" }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.30.3"
        }
    }
}
