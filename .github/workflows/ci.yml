# ci.yml — gbarecompx display-free CI.
#
# Runs everything that needs no literal display:
#   * stub     — the framework with raylib OFF (seam compile-check + pure tests)
#   * raylib   — the framework with raylib 6 ON (fetched by pinned SHA) + full
#     ctest, then the full suite again under a virtual display (Xvfb +
#     llvmpipe): the real backend opens a real window there, so the contract
#     suite takes its full path instead of the Err::Window early-out. One job,
#     two tiers — a standalone gl-xvfb job was folded in (same binary, so a
#     separate job added minutes for no new compilation).
#   * guard    — source-shape guards and their self-tests: the menu View-row
#     wiring (must live outside the retired recomp-ui gate — it once
#     vanished from every product build behind that dead define) and, when
#     ported, the seam-completeness checker.
#   * headless — the framework with raylib on PLATFORM_MEMORY (rlsw software
#     GL): full ctest plus the present/readback/lifecycle smoke, DISPLAY unset.
#     No GL/X11 dev packages needed (the memory platform links neither).
#
# Keep every job green on every push: the public release requires it.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stub:
    name: framework (raylib OFF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submodules
        run: git submodule update --init --recursive

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates ccache

      # Cache ccache so C++ compiles reuse prior objects across runs.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gbx-ccache-stub-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            gbx-ccache-stub-${{ runner.os }}-

      # Cache the CMake build dir so builds are incremental across runs.
      - name: Cache CMake build dir (stub)
        uses: actions/cache@v4
        with:
          path: build-stub
          key: gbx-build-stub-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            gbx-build-stub-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -S . -B build-stub -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGBARECOMP_USE_RAYLIB=OFF
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-stub --parallel

      - name: Test
        run: ctest --test-dir build-stub --output-on-failure

  raylib:
    name: framework (raylib 6 ON, + virtual display)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submodules
        run: git submodule update --init --recursive

      - name: System packages (GL + X11 headers for the raylib build, Xvfb + llvmpipe for the virtual-display tier)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev \
            libfreetype-dev libharfbuzz-dev \
            xvfb libgl1-mesa-dri ccache

      # Cache ccache across runs; the raylib _deps cache (below) stays keyed on
      # the framework CMakeLists so a pin bump re-clones cleanly.
      - name: Cache ccache (raylib)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gbx-ccache-raylib-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            gbx-ccache-raylib-${{ runner.os }}-

      # Cache the CMake build dir so builds are incremental across runs.
      - name: Cache CMake build dir (raylib)
        uses: actions/cache@v4
        with:
          path: build-raylib
          key: gbx-build-raylib-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            gbx-build-raylib-${{ runner.os }}-

      # raylib's FetchContent clone + build are minutes per run; cache them.
      # Keyed on the framework CMakeLists (it carries the pinned SHA), so a
      # pin bump misses and re-clones. No restore-keys: a partial restore
      # could resurrect the wrong raylib source.
      - name: Cache raylib FetchContent (clone + build)
        uses: actions/cache@v4
        with:
          path: build-raylib/_deps
          key: gbx-raylib-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (fetches raylib 6 by pinned SHA)
        run: >
          cmake -S . -B build-raylib -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGBARECOMP_USE_RAYLIB=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-raylib --parallel

      - name: Test
        run: ctest --test-dir build-raylib --output-on-failure

      # Virtual-display tier (same binary): under `xvfb-run -a` the real
      # backend opens a real window on llvmpipe, so backend_contract takes
      # its full path instead of the display-less early-out. Recipe verified
      # in a clean ubuntu:24.04 container.
      - name: Test under Xvfb (virtual display)
        run: xvfb-run -a ctest --test-dir build-raylib --output-on-failure

      # Proof the virtual display did its job: the contract suite must NOT
      # report the display-less early-out.
      - name: Full-path proof (no early-out)
        run: |
          xvfb-run -a ./build-raylib/backend_contract_tests > /tmp/contract.log 2>&1
          tail -n 1 /tmp/contract.log
          if grep -q "generic checks only" /tmp/contract.log; then
            echo "contract suite took the display-less early-out under Xvfb"
            exit 1
          fi

  headless:
    name: framework (rlsw headless, no display)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submodules
        run: git submodule update --init --recursive

      # NOTE: no GL/X11 dev packages here. The memory platform links neither
      # (undefined GLFW references were the Phase 5.2 red); plain build tools
      # are the whole list.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates ccache

      # Cache ccache across runs; the raylib _deps cache (below) stays keyed on
      # the framework CMakeLists so a pin bump re-clones cleanly.
      - name: Cache ccache (headless)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gbx-ccache-headless-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            gbx-ccache-headless-${{ runner.os }}-

      # Cache the CMake build dir so builds are incremental across runs.
      - name: Cache CMake build dir (headless)
        uses: actions/cache@v4
        with:
          path: build-raylib-headless
          key: gbx-build-headless-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            gbx-build-headless-${{ runner.os }}-

      - name: Cache raylib FetchContent (clone + build)
        uses: actions/cache@v4
        with:
          path: build-raylib-headless/_deps
          key: gbx-raylib-headless-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (PLATFORM_MEMORY + software GL)
        run: >
          cmake -S . -B build-raylib-headless -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGBARECOMP_USE_RAYLIB=ON
          -DGBARECOMP_RAYLIB_HEADLESS=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-raylib-headless --parallel

      - name: Test (full suite, no display)
        run: ctest --test-dir build-raylib-headless --output-on-failure

      # The gate states which tier ran: ctest hides stdout on pass, so the
      # smoke runs once more for its tier line.
      - name: Tier report
        run: ./build-raylib-headless/raylib_headless_tests | tail -n 1

  guard:
    name: seam completeness guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard + self-tests
        run: |
          python3 tools/check_menu_view_wiring.py --self-test
          python3 tools/check_menu_view_wiring.py
          if [ -f tools/check_raylib_backend_complete.py ]; then
            python3 tools/check_raylib_backend_complete.py
            python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          else
            echo "completeness checker not ported into this tree yet (release phase)"
          fi
